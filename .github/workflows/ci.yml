name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Vendor worldgen stack
        shell: bash
        run: bash scripts/ensure-vendor.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --quiet -p mcaedit-cli
          BIN=./target/debug/mcaedit
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          "${BIN}" --help >/dev/null
          ROOT="$(mktemp -d 2>/dev/null || mktemp -d -t mcaedit)"
          mkdir -p "${ROOT}/world/region" "${ROOT}/world/entities"
          "${BIN}" session create --world "${ROOT}/world" --id ci --label ci
          "${BIN}" --session ci edit set-block --x 0 --y 64 --z 0 --block minecraft:stone
          "${BIN}" --session ci inspect get --x 0 --y 64 --z 0 | grep -q stone
          "${BIN}" --session ci view screenshot --from 0,64,0 --to 1,65,1 --out "${ROOT}/shot.png" --width 64 --height 64
          test -f "${ROOT}/shot.png"
          "${BIN}" view preview --help >/dev/null
          "${BIN}" preview --help >/dev/null
          "${BIN}" --session ci commit
          # gen + fix-light + tick (single chunk)
          "${BIN}" --session ci edit gen --seed 1 --dim overworld --from 0,0 --to 0,0
          "${BIN}" --session ci edit fix-light --from 0,0 --to 0,0 --seed 1
          "${BIN}" --session ci edit tick-participate --from 0,0 --to 0,0 --rounds 1
          # brush / pattern / mask / smooth / biome / schem
          "${BIN}" --session ci edit fill --from 0,70,0 --to 7,70,7 --pattern '50%stone,50%dirt'
          "${BIN}" --session ci edit brush sphere --at 16,72,16 --radius 3 --block minecraft:glass --mask air
          "${BIN}" --session ci edit smooth --from 0,64,0 --to 7,80,7 --iterations 1
          "${BIN}" --session ci edit biome --from 0,64,0 --to 7,67,7 --biome minecraft:plains
          "${BIN}" --session ci schem export --from 0,70,0 --to 3,71,3 --out "${ROOT}/t.schem"
          "${BIN}" --session ci schem info --file "${ROOT}/t.schem" | grep -q version=
          "${BIN}" --session ci schem import --file "${ROOT}/t.schem" --at 64,70,64
          "${BIN}" edit brush --help >/dev/null
          "${BIN}" schem --help >/dev/null
