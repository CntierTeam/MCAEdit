interface:
  display_name: "MCAEdit"
  short_description: "代跑 mcaedit：session/WE/gen/commit"
  default_prompt: "按 $mcaedit 当操作员：用户要开 session、inspect、WorldEdit 式编辑、剪贴板/模板、Pumpkin gen/fix-light/tick-participate、history、commit 时，用 shell 直接跑 mcaedit，不要只拼命令或 SAMPLE。缺世界路径/session/坐标先问一句再继续；编辑落工作副本，写回用 commit（可先 --dry-run）。"
policy:
  allow_implicit_invocation: true
