interface:
  display_name: "MCAEdit"
  short_description: "代跑 mcaedit：session/edit/brush/schem/structure/view/world/commit"
  default_prompt: "按 $mcaedit 当操作员（CLI 0.11.0+）：用户要开 session（可 --bootstrap）、inspect（含 summary-box）、区域编辑、brush/mask/%pattern/smooth/smooth3d/biome、grid/colonnade/roof-rows/stairs、剪贴板/模板/schem info|import|export（Sponge v1–v3）、结构 .nbt、world create / level info|write|patch、view screenshot / view preview、地形 gen/fix-light/tick、history、commit 时，用 shell 直接跑 mcaedit，不要只拼命令或 SAMPLE。负坐标优先 --from=-8,60,-8（= 最稳；≥0.9.0 空格形式也可）。缺世界路径/session/坐标先问一句再继续；编辑落工作副本，写回用 commit（可先 --dry-run；注意 lease/mtime warn）；fix-light 只改光不毁方块（≥0.8.2），且 0.10 截图/预览会采 BlockLight/SkyLight 故验收前应修光。view 加载 client jar 的 blockstates+models+贴图（楼梯等非 cubes-only）；日志看 textures=models+textures jar path=... 或 palette reason=...；可用 --minecraft/--max-cells/--no-textures。schem info 可无 session；import 应用 Offset。源码构建默认 Pumpkin 裁枝（MCAEDIT_PUMPKIN_MINIMAL=1）。"
policy:
  allow_implicit_invocation: true
