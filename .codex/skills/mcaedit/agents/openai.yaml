interface:
  display_name: "MCAEdit"
  short_description: "代跑 mcaedit：session/edit/brush/schem/structure/view/world/commit"
  default_prompt: "按 $mcaedit 当操作员：用户要开 session（可 --bootstrap）、inspect、区域编辑、brush/mask/%pattern/smooth/smooth3d/biome、剪贴板/模板/schem、结构 .nbt、world create / level info|write|patch、view screenshot / view preview、地形 gen/fix-light/tick、history、commit 时，用 shell 直接跑 mcaedit，不要只拼命令或 SAMPLE。缺世界路径/session/坐标先问一句再继续；编辑落工作副本，写回用 commit（可先 --dry-run）；截图/预览可用 --minecraft/--assets-jar（26.2 jar）或自动探测。"
policy:
  allow_implicit_invocation: true
