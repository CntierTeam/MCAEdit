interface:
  display_name: "MCAEdit"
  short_description: "代跑 mcaedit：session/编辑/commit"
  default_prompt: "按 $mcaedit 当操作员：用户要开 session、inspect、WorldEdit 式编辑、剪贴板/模板、gen/fix-light/tick、history、commit 时，用 shell 直接跑 mcaedit，不要只拼命令或 SAMPLE。缺世界路径/session/坐标再问一句然后继续跑；编辑后记得 commit。"
policy:
  allow_implicit_invocation: true
