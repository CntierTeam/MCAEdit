[workspace]
resolver = "2"
members = [
    "crates/mcaedit-core",
    "crates/mcaedit-cli",
]
exclude = ["vendor/pumpkin"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "GPL-3.0"
authors = ["CntierTeam"]
repository = "https://github.com/CntierTeam/MCAEdit"

[workspace.dependencies]
mcaedit-core = { path = "crates/mcaedit-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
mca = "2.1"
fastnbt = "2"
flate2 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
zstd = "0.14"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
# Path into submodule; ensure-vendor.sh patches package.workspace so nested inherit works.
pumpkin-world = { path = "vendor/pumpkin/crates/pumpkin-world" }
pumpkin-util = { path = "vendor/pumpkin/crates/pumpkin-util" }
pumpkin-data = { path = "vendor/pumpkin/crates/pumpkin-data" }
pumpkin-config = { path = "vendor/pumpkin/crates/pumpkin-config" }

[profile.release]
lto = true
codegen-units = 1
strip = true
