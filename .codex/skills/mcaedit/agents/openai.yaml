interface:
  display_name: "MCAEdit"
  short_description: "代跑 mcaedit：session/edit/brush/schem/structure/view/world/commit"
  default_prompt: "按 $mcaedit 当操作员（CLI 0.9.0+）：用户要开 session（可 --bootstrap）、inspect（含 summary-box）、区域编辑、brush/mask/%pattern/smooth/smooth3d/biome、grid/colonnade/roof-rows/stairs、剪贴板/模板/schem、结构 .nbt、world create / level info|write|patch、view screenshot / view preview、地形 gen/fix-light/tick、history、commit 时，用 shell 直接跑 mcaedit，不要只拼命令或 SAMPLE。负坐标优先 --from=-8,60,-8（= 最稳；≥0.9.0 空格形式也可）。缺世界路径/session/坐标先问一句再继续；编辑落工作副本，写回用 commit（可先 --dry-run；注意 lease/mtime warn）；fix-light 只改光不毁方块（≥0.8.2）；截图可用 --minecraft/--max-cells 或自动探测，日志看 textures=jar|palette。"
policy:
  allow_implicit_invocation: true
